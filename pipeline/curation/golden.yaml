# Aranylista: híres látnivalók, amelyeknek a valós buildben a megadott
# vármegyében, a megadott kategóriák egyikében, legfeljebb `max_tier` szinten
# (alapból 1 = kiemelt) kell szerepelniük.
# `match`: szórészek, amelyeknek mind szerepelniük kell a pont normalizált
