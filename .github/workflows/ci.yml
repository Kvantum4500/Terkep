name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Adatpipeline (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Egységtesztek
        run: pytest -q
      - name: Mintaadat újraépítése
        run: terkep build --sample
      - name: Adatminőségi tesztek
        run: pytest -q -m data

  web:
    name: Web-app (build, tesztek)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Egységtesztek
        run: npm test
      # Az e2e tesztek a determinisztikus kézi mintaadaton futnak…
      - name: Build mintaadattal (e2e-hez)
        run: npm run build
        env:
          BASE_PATH: /Terkep/
          TERKEP_DATA: ../data/sample
          # az e2e a beágyazott Google-utcaképet is teszteli (a Google-kérés mockolva)
          VITE_GOOGLE_MAPS_EMBED_KEY: e2e-test-key
      - name: Playwright böngésző
        run: npx playwright install --with-deps chromium
      - name: Végponttól végpontig tesztek
        run: npm run e2e
        env:
          BASE_PATH: /Terkep/
      # …a kitelepített app viszont a valós adatból készül (data/, ha van).
      - name: Build valós adattal (GitHub Pages alútvonallal)
        run: npm run build
        env:
          BASE_PATH: /Terkep/
          # nem kötelező: Settings -> Secrets and variables -> Actions -> Variables
          VITE_MAPILLARY_TOKEN: ${{ vars.MAPILLARY_TOKEN }}
          # böngészőkulcs (Maps Embed API, a Pages-címre korlátozva): beágyazott Google-utcakép
          VITE_GOOGLE_MAPS_EMBED_KEY: ${{ vars.GOOGLE_MAPS_EMBED_KEY }}
      - name: E2E riport
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - name: Pages-csomag
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: GitHub Pages
    # csak az alapértelmezett ágról és csak nyilvános repóban (a Pages ingyenes
    # változata ezt igényli); a repó Settings -> Pages -> Source: GitHub Actions
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event.repository.private == false
    needs: [pipeline, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
