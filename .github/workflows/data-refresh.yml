name: Adatfrissítés

# Kézzel indítható (Actions -> Adatfrissítés -> Run workflow). A GitHub szerverén
# letölti az OSM-, Wikidata-, Wikipédia- és Commons-adatokat, lefuttatja az
# összevonást és a pontozást, majd PR-t nyit a data/ változásaival.
# Ehhez a repóban engedélyezni kell: Settings -> Actions -> General ->
# "Allow GitHub Actions to create and approve pull requests".
#
# Havi automatikus futáshoz vedd ki a megjegyzésből a schedule részt.
on:
  workflow_dispatch:
    inputs:
      discover_sites:
        description: "Túraoldalak felderítése (robots.txt, sitemap, ÁSZF – csak riport)"
        type: boolean
        default: true
      fetch_sites:
        description: "Az engedélyezett túraoldalak letöltése (sources.yaml: enabled)"
        type: boolean
        default: false
  # schedule:
  #   - cron: "17 3 2 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e '.[dev]'

      - name: Letöltési gyorsítótár (Wikidata, Wikipédia, oldalak)
        uses: actions/cache@v4
        with:
          path: |
            pipeline/cache/http
            pipeline/build/wikidata_classes.json
          key: terkep-http-${{ github.run_id }}
          restore-keys: terkep-http-

      - name: Wikidata QID-ek ellenőrzése
        run: terkep verify-config
        continue-on-error: true

      - name: OpenStreetMap (Geofabrik PBF)
        run: terkep fetch osm
      - name: Wikidata
        run: terkep fetch wikidata
      - name: Magyar Wikipédia-listák
        run: terkep fetch huwiki
      - name: Commons-képek szerzője és licence
        run: terkep fetch commons

      - name: Túraoldalak felderítése
        if: inputs.discover_sites
        run: terkep discover all
        continue-on-error: true
      - name: Túraoldalak letöltése
        if: inputs.fetch_sites
        run: terkep fetch site all

      - name: Összevonás, pontozás, export
        run: terkep build
      - name: Adatminőségi tesztek
        run: pytest -q -m data
      - name: Aranylista
        id: golden
        run: terkep golden | tee build/reports/golden.txt
        continue-on-error: true

      - name: Riportok
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adatfrissites-riport
          path: |
            pipeline/build/reports
            pipeline/build/discovery
          retention-days: 30

      - name: PR a friss adattal
        uses: peter-evans/create-pull-request@v7
        with:
          # a PR abba az ágba megy, amelyen a workflow fut (alapértelmezett ág)
          base: ${{ github.ref_name }}
          branch: adatfrissites
          delete-branch: true
          commit-message: "Adatfrissítés: OSM, Wikidata, Wikipédia"
          title: "Adatfrissítés"
          body-path: pipeline/build/reports/report.md
          add-paths: |
            data/pois.ndjson
            data/meta.json
            data/id_aliases.json
            data/megyek.geojson
