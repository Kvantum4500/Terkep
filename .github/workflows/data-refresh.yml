name: Adatfrissítés

# Kézzel indítható (Actions -> Adatfrissítés -> Run workflow). A GitHub szerverén
# letölti az OSM-, Wikidata-, Wikipédia- és Commons-adatokat, lefuttatja az
# összevonást és a pontozást, majd PR-t nyit a data/ változásaival.
# Ehhez a repóban engedélyezni kell: Settings -> Actions -> General ->
# "Allow GitHub Actions to create and approve pull requests".
#
# Havi automatikus futáshoz vedd ki a megjegyzésből a schedule részt.
on:
  workflow_dispatch:
    inputs:
      discover_sites:
        description: "Túraoldalak felderítése (robots.txt, sitemap, ÁSZF – csak riport)"
        type: boolean
        default: true
      fetch_sites:
        description: "Az engedélyezett túraoldalak letöltése (sources.yaml: enabled)"
        type: boolean
        default: false
  # schedule:
  #   - cron: "17 3 2 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e '.[dev]'

      # A gyorsítótárat külön állítjuk vissza és mentjük, hogy egy későbbi lépés
      # hibájánál is megmaradjon (különben a Wikidata-letöltés újra 12+ perc).
      - name: Letöltési gyorsítótár visszaállítása (Wikidata, Wikipédia, oldalak)
        uses: actions/cache/restore@v4
        with:
          path: |
            pipeline/cache/http
            pipeline/build/wikidata_classes.json
            pipeline/build/streetview.json
          key: terkep-http-${{ github.run_id }}
          restore-keys: terkep-http-

      # Hibás QID (pl. „arboretum” helyett „warehouse”) csendben rossz adatot adna:
      # ezért ez a lépés megállítja a futást.
      - name: Wikidata QID-ek ellenőrzése
        run: terkep verify-config

      # Az OSM-kivonat (~300 MB) a GitHub gyorsítótárában is megmarad: ha a
      # letöltőszerverek épp nem érhetők el, a legutóbbi példánnyal megy tovább,
      # és egy hétnél frissebb példányt nem tölt le újra.
      - name: OSM-kivonat visszaállítása a gyorsítótárból
        uses: actions/cache/restore@v4
        with:
          path: pipeline/cache/osm
          key: terkep-pbf-${{ github.run_id }}
          restore-keys: terkep-pbf-

      - name: OpenStreetMap (Geofabrik PBF, tükörrel)
        run: terkep fetch osm

      - name: OSM-kivonat mentése a gyorsítótárba
        uses: actions/cache/save@v4
        with:
          path: pipeline/cache/osm
          key: terkep-pbf-${{ github.run_id }}
      - name: Wikidata
        run: terkep fetch wikidata
      - name: Magyar Wikipédia-listák
        run: terkep fetch huwiki
      - name: Commons-képek szerzője és licence
        run: terkep fetch commons

      - name: Túraoldalak felderítése
        if: inputs.discover_sites
        run: terkep discover all
        continue-on-error: true
      - name: Túraoldalak letöltése
        if: inputs.fetch_sites
        run: terkep fetch site all

      - name: Összevonás, pontozás, export
        run: terkep build

      # Google-utcakép a kiemelt és érdekes helyeknél (a metaadat ingyenes). Kulcs nélkül kimarad.
      # A kulcs csak titokként kerül ide, a parancs sosem írja ki.
      - name: Google-utcakép helye
        env:
          GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY }}
        run: terkep fetch streetview
        continue-on-error: true
      - name: Összevonás újra (utcakép-adattal)
        run: terkep build
      - name: 360°-os képek lefedettsége
        run: terkep pano-audit
        continue-on-error: true
      - name: Adatminőségi tesztek
        # az eredmény a riportba kerül; a PR-en a CI is lefuttatja és jelzi
        run: pytest -q -m data 2>&1 | tee build/reports/data_qa.txt
        continue-on-error: true
      - name: Aranylista
        id: golden
        run: terkep golden | tee build/reports/golden.txt
        continue-on-error: true

      - name: Letöltési gyorsítótár mentése
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            pipeline/cache/http
            pipeline/build/wikidata_classes.json
            pipeline/build/streetview.json
          key: terkep-http-${{ github.run_id }}

      - name: Riportok
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adatfrissites-riport
          path: |
            pipeline/build/reports
            pipeline/build/discovery
          retention-days: 30

      - name: PR a friss adattal
        uses: peter-evans/create-pull-request@v7
        with:
          # a PR abba az ágba megy, amelyen a workflow fut (alapértelmezett ág)
          base: ${{ github.ref_name }}
          branch: adatfrissites
          delete-branch: true
          commit-message: "Adatfrissítés: OSM, Wikidata, Wikipédia"
          title: "Adatfrissítés"
          body-path: pipeline/build/reports/report.md
          add-paths: |
            data/pois.ndjson
            data/meta.json
            data/id_aliases.json
            data/megyek.geojson
